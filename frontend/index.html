<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Project Management System</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('themeMode') || localStorage.getItem('theme');
          var isDark = mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #07090e;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #07090e; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none;">
        <img src="/logo-with-text-dark.png" alt="Project Management System" style="height: 64px; max-width: 80vw; object-fit: contain; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
